version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    target-branch: ml-dsa-verify-6.0
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
