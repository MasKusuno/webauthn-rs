name: upstream-sync

# Rebase `ml-dsa-verify` onto `kanidm/webauthn-rs:master` once a week,
# then force-push the rebased stack directly back to `ml-dsa-verify`.
#
# Rationale for direct force-push (no intermediate review PR): an
# earlier design routed rebases through `automation/upstream-rebase` →
# PR → human merge, but the squash-merge button in the GitHub UI
# collapses the 11-commit fork patch stack into one commit — which
# destroys the review/drop-individual-patch affordance the whole
# narrow-fork discipline depends on (ADR-004 in civid). Direct
# force-push-with-lease preserves linear history.
#
# Guard rails that replace PR review:
#   1. `--force-with-lease` — refuses if the remote tip moved since we
#      fetched, so racing pushes don't silently clobber in-flight work.
#   2. Conflict → issue (not silent). Rebase failures open (or refresh)
#      an `upstream-sync`-labelled tracking issue with the failing
#      paths, and no push is attempted.
#   3. civid's `webauthn-rs-bump.yml` opens an auto-merge PR on
#      `Cargo.lock` once this job lands new commits; branch protection
#      on civid's `main` (fmt + clippy + test + xtask) is the real CI
#      gate. If the rebased `ml-dsa-verify` breaks civid's build, the
#      bump PR parks open for human triage.
#
# This fork carries spec-compliance + ML-DSA patches on top of kanidm
# master. Keeping it cleanly rebased lets civid drop the
# `[patch.crates-io]` block once each series lands upstream.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ml-dsa-verify
        uses: actions/checkout@v4
        with:
          ref: ml-dsa-verify
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/kanidm/webauthn-rs.git
          git fetch upstream master --tags

      - name: Capture pre-push tip (for force-with-lease)
        id: lease
        run: |
          echo "expected=$(git rev-parse ml-dsa-verify)" >>"$GITHUB_OUTPUT"

      - name: Attempt rebase
        id: rebase
        run: |
          set -euo pipefail

          UPSTREAM_SHA=$(git rev-parse upstream/master)
          echo "upstream_sha=$UPSTREAM_SHA" >>"$GITHUB_OUTPUT"
          echo "upstream_short=${UPSTREAM_SHA:0:8}" >>"$GITHUB_OUTPUT"

          MERGE_BASE=$(git merge-base ml-dsa-verify upstream/master)
          if [ "$MERGE_BASE" = "$UPSTREAM_SHA" ]; then
            echo "ml-dsa-verify already contains upstream/master — nothing to do."
            echo "status=up-to-date" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout ml-dsa-verify
          if git rebase upstream/master; then
            echo "status=rebased" >>"$GITHUB_OUTPUT"
            echo "new_tip=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
            echo "new_tip_short=$(git rev-parse --short=8 HEAD)" >>"$GITHUB_OUTPUT"
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U || true)
            git rebase --abort || true
            {
              echo "status=conflict"
              echo "conflicts<<EOF"
              echo "$CONFLICTS"
              echo "EOF"
            } >>"$GITHUB_OUTPUT"
          fi

      - name: Force-push ml-dsa-verify
        if: steps.rebase.outputs.status == 'rebased'
        run: |
          git push --force-with-lease="ml-dsa-verify:${{ steps.lease.outputs.expected }}" origin ml-dsa-verify

      - name: Open or refresh conflict issue
        if: steps.rebase.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHORT: ${{ steps.rebase.outputs.upstream_short }}
          CONFLICTS: ${{ steps.rebase.outputs.conflicts }}
        run: |
          set -euo pipefail
          TITLE="upstream-sync: rebase conflict against kanidm/master"
          BODY=$(cat <<EOF
          The weekly \`upstream-sync\` job failed to rebase \`ml-dsa-verify\` onto \`kanidm/master@${UPSTREAM_SHORT}\`.

          **Conflicting paths**
          \`\`\`
          ${CONFLICTS:-(unknown — check workflow logs)}
          \`\`\`

          **Resolution**
          1. \`git fetch upstream master\`
          2. \`git checkout ml-dsa-verify && git rebase upstream/master\`
          3. Resolve conflicts, \`git push --force-with-lease\`.
          4. Close this issue once \`ml-dsa-verify\` is back on top of upstream.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          EXISTING=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Rebase still failing against upstream \`${UPSTREAM_SHORT}\` — see run ${{ github.run_id }}."
          else
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label upstream-sync
          fi

      - name: Summary
        run: |
          {
            echo "### upstream-sync outcome"
            echo ""
            echo "Status: \`${{ steps.rebase.outputs.status }}\`"
            echo "Upstream tip: \`${{ steps.rebase.outputs.upstream_short }}\`"
            if [ "${{ steps.rebase.outputs.status }}" = "rebased" ]; then
              echo "New \`ml-dsa-verify\` tip: \`${{ steps.rebase.outputs.new_tip_short }}\`"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
