[package]
name = "webauthn-rs-core"
description = "Webauthn Cryptographic Operation Handling"
readme = "README.md"
keywords = ["webauthn", "authentication"]
categories = ["authentication", "web-programming"]

version = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[features]
default = []
# Enables post-quantum (ML-DSA-44 / -65 / -87) WebAuthn signature verification.
# Added for civid feature 027 (https://github.com/digital-go-jp/civid/issues/290).
# Off by default because the underlying ml-dsa crate is v0.0.x + unaudited.
ml-dsa = ["dep:ml-dsa"]
# Enables acceptance of synthetic vendor IDs / fixtures the FIDO2 Server
# conformance tool emits. Added for civid#378/#389 (ADR-004 Category 2).
# Off by default — production consumers MUST NOT enable this. civid gates
# it behind its conformance-fido-adapter feature chain, which is already
# triple-gated (civid ADR-003).
fido-conformance-testing = []

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
base64.workspace = true
crypto-glue.workspace = true
hex.workspace = true
webauthn-attestation-ca.workspace = true
webauthn-rs-proto.workspace = true
serde.workspace = true
serde_cbor_2.workspace = true
serde_json.workspace = true
serde_with.workspace = true
nom.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
rand_chacha.workspace = true
url = { workspace = true, features = ["serde"] }
x509-parser = "0.16"
der-parser = "9.0"
uuid = { workspace = true, features = ["serde"] }
ml-dsa = { workspace = true, optional = true }
# Ed25519 / EdDSA verifier — see workspace Cargo.toml comment.
ed25519-dalek = { workspace = true }

[dev-dependencies]
hex-literal = "0.4"
tracing-subscriber.workspace = true
webauthn-rs-device-catalog.workspace = true
