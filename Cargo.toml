[workspace.package]
version = "0.6.1-dev"
authors = [
    "William Brown <william@blackhats.net.au>",
    "Michael Farrell <micolous+git@gmail.com>",
    "James Hodgkinson <james@terminaloutcomes.com>",
]
rust-version = "1.88"
edition = "2021"
repository = "https://github.com/kanidm/webauthn-rs"
homepage = "https://github.com/kanidm/webauthn-rs"
license = "MPL-2.0"

[workspace]
resolver = "2"
members = [
    # Support Libraries
    "base64urlsafedata",
    "webauthn-rs-proto",
    "webauthn-rs-core",
    # The actually library.
    "webauthn-rs",
    # Authenticator interactions
    "fido-hid-rs",
    "webauthn-authenticator-rs",
    # caBLE tunnel server
    "cable-tunnel-server/backend",
    "cable-tunnel-server/common",
    "cable-tunnel-server/frontend",
    "fido-key-manager",
    # Tutorial / Example sites.
    "tutorial/server/axum",
    "tutorial/server/actix_web",
    "tutorial/wasm",
    # Attestatation struct format
    "attestation-ca",
    # Fido MDS tools
    "fido-mds",
    "fido-mds-tool",
    # Our Device Catalog
    "device-catalog",
    # "device-catalog-tool",
    # Ssh Key Attestation
    "sshkey-attest",
    # RP Proxy
    "webauthn-rp-proxy",
]

# `compat_tester/webauthn-rs-demo*` are excluded from the civid fork build:
# the demo binary pulls tide 0.16 → http-types → async-h1 / rustls 0.19 /
# ring 0.16 / aesni / aes-soft, which collectively contribute the entire
# `cargo audit` warning set. The fork does not run the demo; upstream
# kanidm still hosts it at webauthn.firstyear.id. Keep the source tree in
# place to minimize upstream-rebase friction (sibling files keep landing).
# `webauthn-rs-demo-wasm` was already excluded for `--cfg=web_sys_unstable_apis`.
exclude = [
    "compat_tester/webauthn-rs-demo",
    "compat_tester/webauthn-rs-demo-shared",
    "compat_tester/webauthn-rs-demo-wasm",
    "tutorial/wasm",
]

# [patch.crates-io]
# crypto-glue = { path = "../crypto-glue" }
# crypto-glue = { git = "https://github.com/kanidm/crypto-glue.git", branch = "6.0-webauthn-rs" }

[workspace.dependencies]
# These are in release/dependency order.
# base64urlsafedata = { path = "./base64urlsafedata", version = "=0.6.1-dev" }

fido-hid-rs = { path = "./fido-hid-rs", version = "=0.6.1-dev" }
webauthn-attestation-ca = { path = "./attestation-ca", version = "=0.6.1-dev" }
webauthn-rs-proto = { path = "./webauthn-rs-proto", version = "=0.6.1-dev" }
fido-mds = { path = "./fido-mds", version = "=0.6.1-dev" }
webauthn-rs-core = { path = "./webauthn-rs-core", version = "=0.6.1-dev" }
webauthn-rs = { path = "./webauthn-rs", version = "=0.6.1-dev" }
webauthn-authenticator-rs = { path = "./webauthn-authenticator-rs", version = "=0.6.1-dev" }

# Currently un-released
cable-tunnel-server-common = { path = "./cable-tunnel-server/common", version = "0.1.0" }
webauthn-rs-device-catalog = { path = "./device-catalog" }

async-std = { version = "1.6", features = ["attributes"] }
async-trait = "~0.1"
anyhow = "1.0"
base64 = "0.21"
clap = { version = "^4.5", features = ["derive", "env"] }

crypto-glue = "^0.1.15"
compact_jwt = "0.5.6"
futures = "^0.3.25"
hex = "0.4.3"
http = "^0.2.9"
http-body = "1.0.1"
http-body-util = "0.1.2"
hyper = { version = "1.5.1", default-features = false, features = ["http1"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
nom = "7.1"
num-derive = { version = "0.4.2" }
peg = "0.8.5"

tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }
tokio = { version = "1.47.2", features = [
    "sync",
    "test-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }

tokio-tungstenite = { version = "^0.28.0", features = ["native-tls"] }
tracing = "^0.1.43"
tracing-log = { version = "0.2.0" }
tungstenite = { version = "^0.28.0", default-features = false, features = [
    "handshake",
] }
url = "2"
uuid = "^1.19.0"
serde = { version = "^1.0.228", features = ["derive"] }
serde_cbor_2 = { version = "0.13.0" }

# Post-quantum signature verification (FIPS 204 / ML-DSA / Dilithium).
# civid fork addition — see
#   https://github.com/digital-go-jp/civid/issues/288 (ADR-008 PQC roadmap)
#   https://github.com/digital-go-jp/civid/issues/290 (feature 027 PoC)
# RustCrypto pure-Rust impl; still self-described as "never been independently
# audited" in the upstream README as of 0.1.0 (2026-05-17). Use verify-only.
# 0.1.0 patches RUSTSEC-2025-0144 (timing side-channel in `decompose` during
# signing) — not on our verify path, but moving forward to stay current.
ml-dsa = "0.1"
# Ed25519 / EdDSA verify path. crypto-glue 0.1.16 does not surface an
# Ed25519 verifier (kanidm's 6.0 line punted the openssl ed25519 path
# during the RustCrypto migration), so the fork pulls ed25519-dalek
# directly into webauthn-rs-core. Verify-only — no signing surface.
# RustCrypto pure-Rust impl. 3.0.0-rc.0 tracks the `signature` v3 ecosystem
# in lockstep with ml-dsa 0.1; verify-only API surface is unchanged.
ed25519-dalek = { version = "3.0.0-rc.0", default-features = false, features = ["fast", "zeroize"] }
serde_json = "^1.0.145"
serde_with = { version = "3.16.1", features = ["base64", "macros"] }
rand = "0.9.2"
rand_chacha = "0.9.0"
reqwest = { version = "0.12.25", default-features = false, features = [
    "rustls-tls-native-roots",
] }
thiserror = "^1.0.69"
tokio-native-tls = "^0.3.1"
tokio-stream = { version = "0.1", features = ["sync"] }
